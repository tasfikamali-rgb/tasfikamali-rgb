name: Contribution card

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/contrib/**", ".github/workflows/contrib.yml"]

permissions:
  contents: write

concurrency:
  group: contrib-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the card from the live contribution calendar
        run: python3 .github/contrib/contrib_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: assets
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-*.svg
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Refresh contribution card" && git push; fi
